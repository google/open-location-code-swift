name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions: {}

jobs:
  linux:
    name: Linux (SwiftPM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Build and test in Swift 6 container
        run: docker build .

  apple:
    name: Apple Platforms (SwiftPM & Xcode)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Run SwiftPM tests (macOS)
        run: |
          swift --version
          swift test

      - name: Run Xcode framework tests (macOS)
        run: |
          xcodebuild test \
            -project OpenLocationCode.xcodeproj \
            -scheme OpenLocationCode_macOS \
            -destination 'platform=macOS'

      - name: Run Xcode framework tests (iOS Simulator)
        run: |
          SIM_UDID=$(xcrun simctl list devices available -j | jq -r '
            [
              .devices
              | to_entries
              | sort_by(.key)
              | reverse[]
              | select(.key | contains("SimRuntime.iOS-"))
              | .value[]
              | select(.isAvailable == true and (.name | startswith("iPhone")))
              | .udid
            ][0] // empty
          ')
          if [ -z "$SIM_UDID" ]; then
            echo "Error: No available iPhone Simulator found" >&2
            exit 1
          fi
          xcodebuild test \
            -project OpenLocationCode.xcodeproj \
            -scheme OpenLocationCode_iOS \
            -destination "platform=iOS Simulator,id=${SIM_UDID}"

      - name: Build Release frameworks
        run: |
          SDKS=$(xcodebuild -showsdks)
          xcodebuild build \
            -project OpenLocationCode.xcodeproj \
            -scheme OpenLocationCode_macOS \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild build \
            -project OpenLocationCode.xcodeproj \
            -scheme OpenLocationCode_iOS \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO
          if echo "$SDKS" | grep -q "appletvos"; then
            xcodebuild build \
              -project OpenLocationCode.xcodeproj \
              -scheme OpenLocationCode_tvOS \
              -destination 'generic/platform=tvOS' \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO
          fi
          if echo "$SDKS" | grep -q "watchos"; then
            xcodebuild build \
              -project OpenLocationCode.xcodeproj \
              -scheme OpenLocationCode_watchOS \
              -destination 'generic/platform=watchOS' \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO
          fi
